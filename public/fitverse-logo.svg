<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ccff00" />
      <stop offset="100%" stop-color="#9135ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Card Style -->
  <rect width="400" height="120" rx="16" fill="#0b0f17" />

  <!-- Dumbbell / Fitness Icon Mark -->
  <g transform="translate(30, 25) scale(0.8)" filter="url(#glow)">
    <!-- Left Weight Plates -->
    <rect x="0" y="15" width="10" height="40" rx="3" fill="#ccff00" />
    <rect x="12" y="20" width="8" height="30" rx="2" fill="#ccff00" />
    <!-- Bar -->
    <rect x="20" y="32" width="36" height="6" rx="2" fill="#ffffff" />
    <!-- Right Weight Plates -->
    <rect x="58" y="20" width="8" height="30" rx="2" fill="#ccff00" />
    <rect x="68" y="15" width="10" height="40" rx="3" fill="#ccff00" />
    <!-- AI Circuit Nodes -->
    <circle cx="38" cy="20" r="3" fill="#9135ff" />
    <path d="M38 20 L38 32" stroke="#9135ff" stroke-width="2" />
  </g>

  <!-- Typography: FITVERSE AI -->
  <text x="125" y="58" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#ffffff" letter-spacing="2">
    FITVERSE <tspan fill="#ccff00">AI</tspan>
  </text>

  <!-- Tagline: STAY | STRONG -->
  <text x="127" y="85" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#9ca3af" letter-spacing="5">
    STAY <tspan fill="#ccff00">|</tspan> STRONG
  </text>
</svg>
